<script>
	// Ensure responsive media queries work on mobile by adding viewport meta at runtime
	(function ensureViewportMeta() {
		if (!document.querySelector('meta[name="viewport"]')) {
			const m = document.createElement("meta");
			m.name = "viewport";
			m.content = "width=device-width, initial-scale=1";
			document.head.appendChild(m);
		}
	})();

	// Mobile hamburger menu — toggle accordion overlay on small screens
	(function initMobileMenu() {
		const hamburger = document.getElementById("hamburgerBtn");
		const closeBtn = document.getElementById("closePanelBtn");
		const panel = document.getElementById("accordionPanel");
		if (!hamburger || !closeBtn || !panel) return;

		function openOverlay() {
			panel.classList.add("mobile-overlay-open");
			hamburger.setAttribute("aria-expanded", "true");
		}
		function closeOverlay() {
			panel.classList.remove("mobile-overlay-open");
			hamburger.setAttribute("aria-expanded", "false");
		}

		hamburger.addEventListener("click", openOverlay);
		closeBtn.addEventListener("click", closeOverlay);

		// Optional: close on escape key
		document.addEventListener("keydown", (e) => {
			if (
				e.key === "Escape" &&
				panel.classList.contains("mobile-overlay-open")
			) {
				closeOverlay();
			}
		});
	})();

	// Mapping: location index -> accordion details element (kept in sync with filtering)
	let accordionItems = [];

	function getFilteredLocations() {
		const query = (
			document.getElementById("acSearch")?.value || ""
		).toLowerCase();
		const cat = document.getElementById("acCategory")?.value || "all";
		return locations.filter((loc) => {
			const hay = `${loc.name || ""} ${loc.url || ""}`.toLowerCase();
			if (!hay.includes(query)) return false;
			if (cat === "all") return true;
			return (loc.category || "services") === cat;
		});
	}

	/**
	 * Show only business markers that match search + category; refresh clusters.
	 */
	function syncBusinessMarkersToFilter(map, markers, clusterer) {
		const filtered = getFilteredLocations();
		const visibleIdx = new Set(filtered.map((loc) => locations.indexOf(loc)));
		const visibleMarkers = markers.filter((_, idx) => visibleIdx.has(idx));
		if (clusterer) {
			clusterer.clearMarkers();
			clusterer.addMarkers(visibleMarkers);
		} else {
			markers.forEach((m, idx) => {
				m.setMap(visibleIdx.has(idx) ? map : null);
			});
		}
	}

	// Build accordion UI from locations
	function buildAccordion(markers, map, info, clusterer) {
		const panel = document.getElementById("accordionPanel");
		let resultsShell = panel.querySelector(".ac-results");
		if (!resultsShell) {
			resultsShell = document.createElement("div");
			resultsShell.className = "ac-results";
			panel.appendChild(resultsShell);
		}

		const listContainer = document.createElement("div");
		listContainer.id = "acList";
		// Clear any previous list
		resultsShell.querySelectorAll("#acList").forEach((n) => n.remove());
		resultsShell.appendChild(listContainer);

		const filtered = getFilteredLocations();

		accordionItems = [];

		if (filtered.length === 0) {
			const emptyEl = document.createElement("div");
			emptyEl.className = "ac-empty-state";
			emptyEl.innerHTML = `
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<circle cx="11" cy="11" r="8"/>
					<path d="m21 21-4.35-4.35"/>
				</svg>
				<span>No Results</span>
			`;
			listContainer.appendChild(emptyEl);
			syncBusinessMarkersToFilter(map, markers, clusterer);
			return;
		}

		filtered.forEach((loc, idxFiltered) => {
			const idx = locations.indexOf(loc);

			const details = document.createElement("details");
			details.className = "ac-item";
			// Keep all expanded per request
			details.open = true;

			const summary = document.createElement("summary");
			summary.className = "ac-summary"; // still clickable
			const hasUrl = Boolean(loc.url);
			const phoneHref = loc.phone
				? `tel:${loc.phone.replace(/[^0-9+]/g, "")}`
				: "";
			const directionsUrl = `https://www.google.com/maps/dir/?api=1&destination=${loc.lat},${loc.lng}`;
			summary.innerHTML = `
                <div class="ac-card" tabindex="0">
                    <div class="ac-image" style="background-image: url('${
						loc.image ||
						"https://images.squarespace-cdn.com/content/v1/67f73c88fa874d611b62f3b9/51f93621-f3c9-4ae5-a81e-b74c6dbab952/Common+Good.png"
					}');"></div>
                    <div class="ac-content">
                        <div class="ac-title">${loc.name}</div>
                        ${
							loc.address
								? `<div class="ac-address">${loc.address}</div>`
								: ""
						}
                        ${
							hasUrl
								? `<a class="ac-url" href="${loc.url}" target="_blank" rel="noopener">${loc.url}</a>`
								: ""
						}
                        <div class="ac-contact-row">
                        ${
							loc.phone
								? `<a class="ac-phone" href="${phoneHref}">${loc.phone}</a>`
								: ""
						}
                        <a class="ac-directions" href="${directionsUrl}" target="_blank" rel="noopener" aria-label="Get directions">
                        
                        Get Directions
						<svg viewBox="0 0 24 24 " fill="currentColor" aria-hidden="true"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg></a>
                        </div>
                    </div>
                </div>
            `;

			const body = document.createElement("div");
			body.className = "ac-body";
			// additional text/details could go here later

			details.appendChild(summary);
			details.appendChild(body);
			listContainer.appendChild(details);
			accordionItems[idx] = details;
			window.accordionItems = accordionItems; // expose for marker click handler

			// Sync: clicking the accordion summary centers and selects the marker
			summary.addEventListener("click", (e) => {
				e.preventDefault();
				// Keep all open; mark selected for styling
				panel
					.querySelectorAll("details.ac-item")
					.forEach((d) => d.classList.remove("selected"));
				details.classList.add("selected");

				const marker = markers[idx];
				const pos = marker.getPosition();
				map.panTo(pos);
				google.maps.event.trigger(marker, "click");
			});
		});
		syncBusinessMarkersToFilter(map, markers, clusterer);
	}

			// mapId: 'DEMO_MAP_ID' // enables modern vector map (rotation/tilt)
		});

		// Markers + popups
		const info = new google.maps.InfoWindow();
		const markers = locations.map((loc, idx) => {
			const m = new google.maps.Marker({
				position: { lat: loc.lat, lng: loc.lng },
				title: loc.name,
				icon: pinIcon,
				map,
			});

			// Shared helper to build popup content with image + name + address + phone
			const imageUrl =
				loc.image ||
				"https://images.squarespace-cdn.com/content/v1/67f73c88fa874d611b62f3b9/51f93621-f3c9-4ae5-a81e-b74c6dbab952/Common+Good.png";
			const phoneHref = loc.phone
				? `tel:${loc.phone.replace(/[^0-9+]/g, "")}`
				: "";
			const directionsUrl = `https://www.google.com/maps/dir/?api=1&destination=${loc.lat},${loc.lng}`;
			const popupWebsiteBtn = loc.url
				? `<a href="${loc.url}" target="_blank" rel="noopener" aria-label="Open website" style="position:absolute;top:10px;right:10px;background:rgba(255,255,255,0.24);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(14px);color:#ffffff;border:1px solid rgba(255,255,255,0.25);border-radius:999px;padding:6px 10px;text-decoration:none;font-weight:700;z-index:1;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H21V10"/><path d="M10 14L21 3"/><path d="M21 14V21H3V3H10"/></svg>
          </a>`
				: "";
			const popupHtml = `
        <div
          style="
            width: 380px;
			box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
          "
        >
          <div
            style="
              width: 100%;
              height: 240px;
              margin: 0;
              padding: 0;
              border-radius: 0;
              background-image: url('${imageUrl}');
              background-size: cover;
              background-position: center;
              position: relative;
            "
          >${popupWebsiteBtn}</div>
          <div
            style="
              margin: 0;
              padding: 28px 18px 18px 16px;
              background: rgba(255, 255, 255, 0.64); /* lighter for blur effect */
              backdrop-filter: blur(14px);
              -webkit-backdrop-filter: blur(14px);
              border-radius: 0 0 8px 8px;
            "
          >
            ${
				loc.name
					? `<div style="font-weight:500; font-size:18px; margin-bottom:8px; color:#000000;">${loc.name}</div>`
					: ""
			}
            ${
				loc.address
					? `<div style="font-size:14px; text-decoration:underline; margin-bottom:7px; color:#000000;">${loc.address}</div>`
					: ""
			}
            <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-top:6px;">
            ${
				loc.phone
					? `<a href="${phoneHref}" style="font-size:14px; color:#000000; text-decoration:none;">${loc.phone}</a>`
					: ""
			}
            <a href="${directionsUrl}" target="_blank" rel="noopener" style="display:inline-flex; align-items:center; gap:6px; font-size:14px; font-weight:500; color:#c86d04; text-decoration:none;">Get Directions<svg viewBox="0 0 24 24" fill="currentColor" style="width:16px;height:16px;flex-shrink:0" aria-hidden="true"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg></a>
            </div>
          </div>
        </div>`;

			const openInfo = () => {
				info.setContent(popupHtml);
				info.open({ anchor: m, map });
			};

			// Click opens the popup and syncs with accordion
			m.addListener("click", () => {
				openInfo();
				// Highlight matching accordion item on marker click
				const panel = document.getElementById("accordionPanel");
				const items = panel.querySelectorAll("details.ac-item");
				items.forEach((d, i) =>
					d.classList.toggle("selected", i === idx),
				);
				map.panTo(m.getPosition());
				// Scroll inside results container (not the whole page), aim for center
				const targetEl =
					window.accordionItems && window.accordionItems[idx];
				const resultsEl = document.querySelector(
					"#accordionPanel .ac-results",
				);
				if (targetEl && resultsEl) {
					const targetTop = targetEl.offsetTop - resultsEl.offsetTop;
					const targetCenter =
						targetTop -
						resultsEl.clientHeight / 2 +
						targetEl.offsetHeight / 2;
					resultsEl.scrollTo({
						top: targetCenter,
						behavior: "smooth",
					});
				}
			});

			return m;
		});

		const clusterer = new markerClusterer.MarkerClusterer({ map, markers });

		// Landmarks — navy pin (not clustered; always visible)
		const landmarkPinIcon = {
			path: "M12 2C7.6 2 4 5.5 4 9.9c0 6 8 12.1 8 12.1s8-6.1 8-12.1C20 5.5 16.4 2 12 2z",
			fillColor: "#1a3f70",
			fillOpacity: 1,
			strokeColor: "#ffffff",
			strokeOpacity: 1,
			strokeWeight: 3,
			scale: 1.75,
			anchor: new google.maps.Point(12, 22),
		};

		landmarks.forEach((lm) => {
			const lmMarker = new google.maps.Marker({
				position: { lat: lm.lat, lng: lm.lng },
				title: lm.name,
				icon: landmarkPinIcon,
				map,
				zIndex: 1000,
			});
			lmMarker.addListener("click", () => {
				const directionsUrl = `https://www.google.com/maps/dir/?api=1&destination=${lm.lat},${lm.lng}`;
				const escapeHtml = (s) =>
					String(s)
						.replace(/&/g, "&amp;")
						.replace(/</g, "&lt;")
						.replace(/>/g, "&gt;")
						.replace(/"/g, "&quot;");
				const moreBlock = lm.learnMoreUrl
					? `<p style="margin:12px 0 0;"><a href="${lm.learnMoreUrl}" target="_blank" rel="noopener" style="color:#1a3f70;font-weight:600;">Learn more →</a></p>`
					: "";
				const html = `
        <div style="max-width:320px;padding:0;font-family:system-ui,sans-serif;">
          <div style="font-weight:600;font-size:17px;margin-bottom:6px;color:#000;">${escapeHtml(lm.name)}</div>
          ${
				lm.address
					? `<div style="font-size:13px;margin-bottom:8px;color:#333;">${escapeHtml(lm.address)}</div>`
					: ""
			}
          <div style="font-size:14px;line-height:1.45;color:#222;">${escapeHtml(lm.description)}</div>
          ${moreBlock}
          <p style="margin:12px 0 0;">
            <a href="${directionsUrl}" target="_blank" rel="noopener" style="color:#c86d04;font-weight:600;">Get Directions</a>
          </p>
        </div>`;
				info.setContent(html);
				info.open({ anchor: lmMarker, map });
				map.panTo(lmMarker.getPosition());
			});
		});

		map.addListener("click", () => {
			info.close();
		});

		buildAccordion(markers, map, info, clusterer);
		const search = document.getElementById("acSearch");
		if (search) {
			search.addEventListener("input", () =>
				buildAccordion(markers, map, info, clusterer),
			);
		}
		const category = document.getElementById("acCategory");
		if (category) {
			category.addEventListener("change", () =>
				buildAccordion(markers, map, info, clusterer),
			);
		}

		if (FIT_TO_MARKERS_ON_LOAD && (markers.length || landmarks.length)) {
			const bounds = new google.maps.LatLngBounds();
			markers.forEach((m) => bounds.extend(m.getPosition()));
			landmarks.forEach((lm) =>
				bounds.extend({ lat: lm.lat, lng: lm.lng }),
			);
			map.fitBounds(bounds, 48);
		}

		// Expose helpers if you want to tweak live from console
		window._gmap = map;
		window.rotateMap = (deg) => map.setHeading(deg); // e.g., rotateMap(45)
		window.setTilt = (t) => map.setTilt(t); // e.g., setTilt(45)
		window.setZoom = (z) => map.setZoom(z); // e.g., setZoom(16)
	}

	// Helper: read CSS custom props with a fallback
	function getCSS(varName, fallback) {
		const v = getComputedStyle(document.documentElement)
			.getPropertyValue(varName)
			.trim();
		return v || fallback;
	}
</script>
