	.gm-style .gm-style-iw-t {

	.gm-style .gm-style-iw-c {

		background: transparent !important;
		box-shadow: none !important;
	}

	/* Ensure inner container has no spacing */
	.gm-style .gm-style-iw-d {
		padding: 0 !important;
		margin: 0 !important;
		overflow: hidden !important;
	}

	.gm-style .gm-style-iw-t::after {

	.gm-ui-hover-effect {

	/* ===== (A) LAYOUT — full-screen map with floating accordion ===== */
	html,
	body {
		height: 100vh;
		margin: 0;
		font-family:
			system-ui,
			-apple-system,
			BlinkMacSystemFont,
			"SF Pro Text",
			"SF Pro Display",
			"Segoe UI",
			sans-serif;
	}

	#appLayout {
		position: relative;
		display: flex;
		width: 100%;
		height: 100vh; /* fill the viewport height */
	}

	#harlemMap {
		flex: 1;
		height: 100%;
		min-width: 0; /* allow map to shrink so accordion doesn't wrap */
		border-radius: 0;
		box-shadow: none;
		overflow: hidden;
	}

	#accordionPanel {
		position: absolute;
		top: 16px;
		left: 16px;
		width: 420px;
		max-width: calc(100% - 32px);
		max-height: calc(
			100% - 32px
		); /* never taller than viewport, but otherwise auto */
		display: flex;
		flex-direction: column;
		overflow: visible;
		border-radius: 18px;
		box-sizing: border-box;
		padding: 8px 8px 8px 10px; /* breathing room inside */
		z-index: 2; /* ensure panel content sits above the map */
	}

	/* WebKit */
	#accordionPanel::-webkit-scrollbar {
		display: none;
	}

	/* ===== Responsive accordion sizing & visibility ===== */
	@media (max-width: 1200px) {
		#accordionPanel {
			width: 360px;
			flex-basis: 360px;
		}
	}
	@media (max-width: 1050px) {
		#accordionPanel {
			width: 300px;
			flex-basis: 300px;
		}
	}
	@media (max-width: 960px) {
		#accordionPanel {
			width: 260px;
			flex-basis: 260px;
		}
	}
	@media (max-width: 800px) {
		#accordionPanel {
			display: none;
		}
		#appLayout {
			display: block;
			width: 100%;
			height: 100vh;
		}
		#harlemMap {
			width: 100%;
			height: 100%;
		}
	}

	#accordionPanel .ac-item {
		border-bottom: 1px solid rgba(211, 211, 211, 0.35);
		padding: 12px;
	}
	#accordionPanel .ac-item:last-child {
		border-bottom: 0;
	}

	/* Card-style items with image on top and text block underneath */
	#accordionPanel .ac-card {
		position: relative;
		overflow: hidden;
		min-height: 220px;
		background: transparent;
		display: flex;
		flex-direction: column;
	}
	#accordionPanel .ac-image {
		position: relative;
		width: 100%;
		height: 140px;
		flex-shrink: 0;
		border-radius: 10px;
		/* Per-location background image is set inline via JS */
		background-size: cover;
		background-position: center;
		background-repeat: no-repeat;
	}
	#accordionPanel .ac-content {
		display: flex;
		flex-direction: column;
		padding: 10px 12px 12px 0px;
		gap: 2px;
	}
	#accordionPanel .ac-title {
		font-weight: 500;
		font-size: 17px;
		line-height: 1.2;
		margin-bottom: 5px;
	}
	#accordionPanel .ac-address {
		font-size: 12px;
		text-decoration: underline;
		opacity: 0.9;
		margin-bottom: 5px;
	}
	#accordionPanel .ac-phone {
		font-size: 13px;
		font-weight: 400;
		text-decoration: none;
		color: #000000;
	}
	#accordionPanel .ac-link {
		position: absolute;
		top: 10px;
		right: 10px;
		background: rgba(255, 255, 255, 0.24); /* lighter for blur effect */
		backdrop-filter: blur(10px);
		-webkit-backdrop-filter: blur(14px);
		color: #ffffff;
		border: 1px solid rgba(255, 255, 255, 0.25);

		border-radius: 999px;
		padding: 6px 10px;
		text-decoration: none;
		font-weight: 700;
	}
	#accordionPanel .ac-link:hover {
		background: rgb(132, 132, 132);
	}
	#accordionPanel .ac-card:focus-visible,
	#accordionPanel .ac-link:focus-visible {
		outline: 2px solid #ffe9d6;
		outline-offset: 2px;
	}

	/* Remove default summary disclosure marker */
	#accordionPanel summary.ac-summary {
		list-style: none;
		padding: 0;
		margin: 0;
	}
	#accordionPanel summary.ac-summary::-webkit-details-marker {
		display: none;
	}

	/* Search bar */
	#accordionPanel .ac-search {
		position: relative;
		z-index: 3; /* stays visually above results */
		width: 100%;
		box-sizing: border-box;
		background: rgba(255, 255, 255, 0.64); /* lighter for blur effect */
		backdrop-filter: blur(14px);
		-webkit-backdrop-filter: blur(14px);
		border-radius: 30px;
		box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
		margin-bottom: 10px;
	}

	/* Results container block under the search */
	#accordionPanel .ac-results {
		max-height: calc(100vh - 120px); /* scroll only when results are tall */
		overflow: auto; /* browser default scrollbars (often overlay/auto-hide) */
		background: rgba(255, 255, 255, 0.64); /* lighter for blur effect */
		backdrop-filter: blur(14px);
		scrollbar-width: none;
		-webkit-backdrop-filter: blur(14px);
		box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
		border-radius: 14px;
		padding: 10px 10px 4px 10px;
	}
	#accordionPanel .ac-search .field {
		position: relative;
		width: 100%;
	}
	#accordionPanel .ac-search-input {
		width: 100%;
		height: 40px;
		padding: 0 12px 0 36px;
		border-radius: 14px;
		background: rgba(255, 255, 255, 0.64); /* lighter for blur effect */

		line-height: 40px; /* vertically center placeholder and text */
		outline: none;
		display: block;
		box-sizing: border-box;
	}
	#accordionPanel .ac-search .icon {
		position: absolute;
		left: 12px;
		top: 50%;
		transform: translateY(-50%);
		width: 16px;
		height: 16px;
	}

		--pin: #c86d04; /* darker fill color */

	// Mapping: location index -> accordion details element (kept in sync with filtering)
	let accordionItems = [];

	// Build accordion UI from locations
	function buildAccordion(markers, map, info) {
		const panel = document.getElementById("accordionPanel");
		let resultsShell = panel.querySelector(".ac-results");
		if (!resultsShell) {
			resultsShell = document.createElement("div");
			resultsShell.className = "ac-results";
			panel.appendChild(resultsShell);
		}

		const listContainer = document.createElement("div");
		listContainer.id = "acList";
		// Clear any previous list
		resultsShell.querySelectorAll("#acList").forEach((n) => n.remove());
		resultsShell.appendChild(listContainer);

		const query = (
			document.getElementById("acSearch")?.value || ""
		).toLowerCase();
		const filtered = locations.filter((loc) => {
			const hay = `${loc.name || ""} ${loc.url || ""}`.toLowerCase();
			return hay.includes(query);
		});

		accordionItems = [];

		filtered.forEach((loc, idxFiltered) => {
			const idx = locations.indexOf(loc);

			const details = document.createElement("details");
			details.className = "ac-item";
			// Keep all expanded per request
			details.open = true;

			const summary = document.createElement("summary");
			summary.className = "ac-summary"; // still clickable
			const hasUrl = Boolean(loc.url);
			const phoneHref = loc.phone
				? `tel:${loc.phone.replace(/[^0-9+]/g, "")}`
				: "";
			summary.innerHTML = `
                <div class="ac-card" tabindex="0">
                    <div class="ac-image" style="background-image: url('${
						loc.image ||
						"https://images.squarespace-cdn.com/content/v1/67f73c88fa874d611b62f3b9/51f93621-f3c9-4ae5-a81e-b74c6dbab952/Common+Good.png"
					}');"></div>
                    ${
						hasUrl
							? `
                    <a class="ac-link" href="${loc.url}" target="_blank" rel="noopener" aria-label="Open website">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path d="M14 3H21V10" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M10 14L21 3" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M21 14V21H3V3H10" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </a>`
							: ""
					}
                    <div class="ac-content">
                        <div class="ac-title">${loc.name}</div>
                        ${
							loc.address
								? `<div class="ac-address">${loc.address}</div>`
								: ""
						}
                        ${
							loc.phone
								? `<a class="ac-phone" href="${phoneHref}">${loc.phone}</a>`
								: ""
						}
                    </div>
                </div>
            `;

			const body = document.createElement("div");
			body.className = "ac-body";
			// additional text/details could go here later

			details.appendChild(summary);
			details.appendChild(body);
			listContainer.appendChild(details);
			accordionItems[idx] = details;
			window.accordionItems = accordionItems; // expose for marker click handler

			// Sync: clicking the accordion summary centers and selects the marker
			summary.addEventListener("click", (e) => {
				e.preventDefault();
				// Keep all open; mark selected for styling
				panel
					.querySelectorAll("details.ac-item")
					.forEach((d) => d.classList.remove("selected"));
				details.classList.add("selected");

				const marker = markers[idx];
				const pos = marker.getPosition();
				map.panTo(pos);
				google.maps.event.trigger(marker, "click");
			});
		});
	}

	const CUSTOM_STYLE = [

		{

			elementType: "labels.text.fill",
			stylers: [{ color: "#1a3f70" }],

			stylers: [{ color: "#f2f2e1" }],
		},
		// Water labels readable
		{

			stylers: [{ color: "#ffffff" }],
		},

		// Land

		},

		{

	// Hide POI labels/icons and transit icons, keep geometry so buildings render
	const HIDE_DEFAULT_PINS = [
		{
			featureType: "poi",

		},
		{

	// Re-enable park labels with specific styling
	const PARK_LABELS = [

	/* ==========================================================
	     (E) OPTIONAL: FIT TO MARKERS ON LOAD
	     If true, the map will auto-zoom to show all pins, overriding
	     the INITIAL.zoom/center just once on load.
	   ========================================================== */
	const FIT_TO_MARKERS_ON_LOAD = true; // set to true if you prefer

	/* ==========================================================
	     (F) MAP BOOTSTRAP — usually no need to edit below here
	   ========================================================== */
	function initHarlemMap() {
		// Pin icon style (clean circle to match your design)
		const pinIcon = {
			// soft teardrop (rounder, less pointy)
			path: "M12 2C7.6 2 4 5.5 4 9.9c0 6 8 12.1 8 12.1s8-6.1 8-12.1C20 5.5 16.4 2 12 2z",
			fillColor: "#ff540a",
			fillOpacity: 1,
			strokeColor: "#ffffff",
			strokeOpacity: 1,
			strokeWeight: 3,
			// controls size
			scale: 1.6,
			// anchor the point of the drop at the exact lat/lng
			anchor: new google.maps.Point(12, 22),
		};

		// Create the map
		const map = new google.maps.Map(document.getElementById("harlemMap"), {
			center: INITIAL.center,
			zoom: INITIAL.zoom,
			heading: INITIAL.heading,
			tilt: INITIAL.tilt,
			gestureHandling: "auto",
			fullscreenControl: true,
			streetViewControl: false,
			mapTypeControl: false,
			styles: [...HIDE_DEFAULT_PINS, ...PARK_LABELS],
			// mapId: 'DEMO_MAP_ID' // enables modern vector map (rotation/tilt)
		});

		// Markers + popups
		const info = new google.maps.InfoWindow();
		const markers = locations.map((loc, idx) => {
			const m = new google.maps.Marker({
				position: { lat: loc.lat, lng: loc.lng },
				title: loc.name,
				icon: pinIcon,
				map,
			});

			// Shared helper to build popup content with image + name + address + phone
			const imageUrl =
				loc.image ||
				"https://images.squarespace-cdn.com/content/v1/67f73c88fa874d611b62f3b9/51f93621-f3c9-4ae5-a81e-b74c6dbab952/Common+Good.png";
			const phoneHref = loc.phone
				? `tel:${loc.phone.replace(/[^0-9+]/g, "")}`
				: "";
			const popupHtml = `
        <div
          style="
            width: 300px;
			box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border-radius: 8px;
            overflow: hidden;
          "
        >
          <div
            style="
              width: 100%;
              height: 140px;
              margin: 0;
              padding: 0;
              border-radius: 0;
              background-image: url('${imageUrl}');
              background-size: cover;
              background-position: center;
            "
          ></div>
          <div
            style="
              margin: 0;
              padding: 28px 18px 18px 16px;
              background: rgba(255, 255, 255, 0.64); /* lighter for blur effect */
              backdrop-filter: blur(14px);
              -webkit-backdrop-filter: blur(14px);
              border-radius: 0 0 8px 8px;
            "
          >
            ${
				loc.name
					? `<div style="font-weight:500; font-size:18px; margin-bottom:8px; color:#000000;">${loc.name}</div>`
					: ""
			}
            ${
				loc.address
					? `<div style="font-size:14px; text-decoration:underline; margin-bottom:7px; color:#000000;">${loc.address}</div>`
					: ""
			}
            ${
				loc.phone
					? `<a href="${phoneHref}" style="font-size:14px; color:#000000; text-decoration:none;">${loc.phone}</a>`
					: ""
			}
          </div>
        </div>`;

			const openInfo = () => {
				info.setContent(popupHtml);
				info.open({ anchor: m, map });
			};

			// Click opens the popup and syncs with accordion
			m.addListener("click", () => {
				openInfo();
				// Highlight matching accordion item on marker click
				const panel = document.getElementById("accordionPanel");
				const items = panel.querySelectorAll("details.ac-item");
				items.forEach((d, i) =>
					d.classList.toggle("selected", i === idx),
				);
				map.panTo(m.getPosition());
				// Scroll inside results container (not the whole page), aim for center
				const targetEl =
					window.accordionItems && window.accordionItems[idx];
				const resultsEl = document.querySelector(
					"#accordionPanel .ac-results",
				);
				if (targetEl && resultsEl) {
					const targetTop = targetEl.offsetTop - resultsEl.offsetTop;
					const targetCenter =
						targetTop -
						resultsEl.clientHeight / 2 +
						targetEl.offsetHeight / 2;
					resultsEl.scrollTo({
						top: targetCenter,
						behavior: "smooth",
					});
				}
			});

			return m;
		});

		map.addListener("click", () => {
			info.close();
		});
		// Build accordion after markers exist
		buildAccordion(markers, map, info);
		const search = document.getElementById("acSearch");
		if (search) {
			search.addEventListener("input", () =>
				buildAccordion(markers, map, info),
			);
		}

		// Cluster markers (works automatically as you zoom out)
		new markerClusterer.MarkerClusterer({ map, markers });

		// Optional: auto-fit to pins on load
		if (FIT_TO_MARKERS_ON_LOAD && markers.length) {
			const bounds = new google.maps.LatLngBounds();
			markers.forEach((m) => bounds.extend(m.getPosition()));
			map.fitBounds(bounds, 48);
		}

		// Expose helpers if you want to tweak live from console
		window._gmap = map;
		window.rotateMap = (deg) => map.setHeading(deg); // e.g., rotateMap(45)
		window.setTilt = (t) => map.setTilt(t); // e.g., setTilt(45)
		window.setZoom = (z) => map.setZoom(z); // e.g., setZoom(16)
	}

	// Helper: read CSS custom props with a fallback
	function getCSS(varName, fallback) {
		const v = getComputedStyle(document.documentElement)
			.getPropertyValue(varName)
			.trim();
		return v || fallback;
	}
</script>
