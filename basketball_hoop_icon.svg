    <path d="M 58,172 Q 82,162 106,172" fill="none" stroke="#c04800" stroke-width="5" stroke-linecap="round" opacity="0.6" style="fill:none;stroke:rgb(192, 72, 0);color:rgb(255, 255, 255);stroke-width:5px;stroke-linecap:round;stroke-linejoin:miter;opacity:0.6;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
